<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask My Docs</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Ask My Docs</h1>
      <p class="lede">
        Chat over files in <code>docs/</code>. Choose an embedding model, ingest,
        then ask. Answers come from retrieved chunks, with source filenames.
      </p>
      <div class="toolbar">
        <label class="model-picker" for="embedding-model">
          Embedding model
          <select id="embedding-model"></select>
        </label>
        <button type="button" class="secondary" id="ingest">Ingest docs</button>
      </div>
      <p class="status" id="status"></p>
      <div id="log"></div>
    </main>
    <form id="ask-form">
      <div class="composer">
        <textarea
          id="question"
          rows="1"
          placeholder="Ask a question about your docs"
          required
        ></textarea>
        <button type="submit">Ask</button>
      </div>
    </form>
    <script>
      const log = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const form = document.getElementById("ask-form");
      const questionEl = document.getElementById("question");
      const ingestBtn = document.getElementById("ingest");
      const modelSelect = document.getElementById("embedding-model");
      const MODEL_STORAGE_KEY = "ask-my-docs.embedding-model";

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", isError);
      }

      function addMessage(role, text) {
        const wrap = document.createElement("div");
        wrap.className = `msg ${role}`;
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "Docs";
        wrap.appendChild(label);
        wrap.appendChild(document.createTextNode(text));
        log.appendChild(wrap);
        wrap.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function addAnswer(answer, citations) {
        const wrap = document.createElement("div");
        wrap.className = "msg bot";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Docs";
        wrap.appendChild(label);
        wrap.appendChild(document.createTextNode(answer));
        if (citations && citations.length) {
          const list = document.createElement("ul");
          list.className = "citations";
          citations.forEach((citation) => {
            const item = document.createElement("li");
            item.textContent = citation.source;
            list.appendChild(item);
          });
          wrap.appendChild(list);
        }
        log.appendChild(wrap);
        wrap.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      async function readError(response) {
        try {
          const data = await response.json();
          return data.detail || JSON.stringify(data);
        } catch {
          return `HTTP ${response.status}`;
        }
      }

      async function loadEmbeddingModels() {
        const response = await fetch("/api/embedding-models");
        if (!response.ok) {
          throw new Error(await readError(response));
        }
        const data = await response.json();
        modelSelect.replaceChildren();
        for (const model of data.models) {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = model.label;
          modelSelect.appendChild(option);
        }
        const saved = localStorage.getItem(MODEL_STORAGE_KEY);
        const ids = data.models.map((model) => model.id);
        modelSelect.value = ids.includes(saved) ? saved : data.selected;
      }

      modelSelect.addEventListener("change", () => {
        localStorage.setItem(MODEL_STORAGE_KEY, modelSelect.value);
      });

      ingestBtn.addEventListener("click", async () => {
        ingestBtn.disabled = true;
        modelSelect.disabled = true;
        setStatus("Ingesting…");
        try {
          const response = await fetch("/api/ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ embedding_model: modelSelect.value }),
          });
          if (!response.ok) {
            setStatus(await readError(response), true);
            return;
          }
          const data = await response.json();
          setStatus(data.message || "Ingest complete.");
        } catch (err) {
          setStatus(String(err), true);
        } finally {
          ingestBtn.disabled = false;
          modelSelect.disabled = false;
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const question = questionEl.value.trim();
        if (!question) return;
        const submitBtn = form.querySelector('button[type="submit"]');
        addMessage("user", question);
        questionEl.value = "";
        setStatus("Asking…");
        if (submitBtn) submitBtn.disabled = true;
        try {
          const response = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          if (!response.ok) {
            const detail = await readError(response);
            addMessage("bot", detail);
            setStatus(detail, true);
            return;
          }
          const data = await response.json();
          addAnswer(data.answer || "", data.citations || []);
          const count = (data.citations || []).length;
          setStatus(
            count === 0
              ? "Answered."
              : count === 1
                ? "Answered with 1 source."
                : `Answered with ${count} sources.`
          );
        } catch (err) {
          setStatus(String(err), true);
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });

      loadEmbeddingModels().catch((err) => {
        setStatus(String(err), true);
      });
    </script>
  </body>
</html>
